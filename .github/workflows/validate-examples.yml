# GitHub Actions workflow for validating Account Hardening examples
# This workflow runs on pull requests and validates that rendered Terraform
# matches the expected use cases using LLM-based semantic validation.

name: Validate Examples

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'templates/**'
      - 'examples/**'
      - 'main.tf'
      - 'variables.tf'
      - 'outputs.tf'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'examples/**'
  workflow_dispatch:
    inputs:
      example:
        description: 'Specific example to validate (leave empty for all)'
        required: false
        type: string

env:
  TF_VERSION: "1.6.0"
  PYTHON_VERSION: "3.11"

jobs:
  # First job: Generate rendered Terraform for all examples
  generate-examples:
    name: Generate Rendered Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Generate all examples
        run: |
          cd examples
          for dir in account-cluster-*/; do
            echo "Processing $dir"
            cd "$dir"
            terraform init -input=false
            terraform apply -auto-approve -input=false
            cd ..
          done

      - name: Upload rendered artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: examples/*/rendered-tf/
          retention-days: 1

  # Second job: Validate rendered Terraform with LLM
  validate-examples:
    name: LLM Semantic Validation
    runs-on: ubuntu-latest
    needs: generate-examples
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download rendered artifacts
        uses: actions/download-artifact@v4
        with:
          name: rendered-examples
          path: examples/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install openai pyyaml

      - name: Run LLM validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd examples
          if [ -n "${{ github.event.inputs.example }}" ]; then
            python validate_examples.py --provider openai --example "${{ github.event.inputs.example }}"
          else
            python validate_examples.py --provider openai
          fi

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: examples/validation-results.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'examples/validation-results.json';

            if (!fs.existsSync(path)) {
              console.log('No validation results found');
              return;
            }

            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summary = results.summary;

            let body = `## 🔍 LLM Semantic Validation Results\n\n`;
            body += `| Metric | Value |\n`;
            body += `|--------|-------|\n`;
            body += `| Total Examples | ${summary.total} |\n`;
            body += `| ✅ Passed | ${summary.passed} |\n`;
            body += `| ❌ Failed | ${summary.failed} |\n`;
            body += `| Threshold | ${summary.threshold} |\n\n`;

            body += `### Example Results\n\n`;
            body += `| Example | Use Case | Score | Status |\n`;
            body += `|---------|----------|-------|--------|\n`;

            for (const result of results.results) {
              const status = result.passed ? '✅' : '❌';
              body += `| ${result.example} | ${result.use_case} | ${result.score.toFixed(2)} | ${status} |\n`;
            }

            // Add failed example details
            const failed = results.results.filter(r => !r.passed);
            if (failed.length > 0) {
              body += `\n### ❌ Failed Examples Details\n\n`;
              for (const result of failed) {
                body += `<details>\n<summary>${result.example}: ${result.use_case}</summary>\n\n`;
                if (result.errors.length > 0) {
                  body += `**Errors:**\n`;
                  for (const error of result.errors) {
                    body += `- ${error}\n`;
                  }
                }
                if (result.findings.length > 0) {
                  body += `\n**Findings:**\n`;
                  for (const finding of result.findings) {
                    body += `- ${finding}\n`;
                  }
                }
                body += `\n</details>\n\n`;
              }
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('LLM Semantic Validation Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Third job: Standard Terraform validation
  terraform-validate:
    name: Terraform Syntax Validation
    runs-on: ubuntu-latest
    needs: generate-examples
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download rendered artifacts
        uses: actions/download-artifact@v4
        with:
          name: rendered-examples
          path: examples/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Validate all rendered examples
        run: |
          cd examples
          exit_code=0
          for dir in account-cluster-*/rendered-tf/; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false -input=false
            if ! terraform validate; then
              echo "❌ Validation failed for $dir"
              exit_code=1
            else
              echo "✅ Validation passed for $dir"
            fi
            cd ../..
          done
          exit $exit_code

  # Summary job to report overall status
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [generate-examples, validate-examples, terraform-validate]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Generation: ${{ needs.generate-examples.result }}"
          echo "LLM Validation: ${{ needs.validate-examples.result }}"
          echo "Terraform Validation: ${{ needs.terraform-validate.result }}"

          if [ "${{ needs.generate-examples.result }}" != "success" ]; then
            echo "❌ Example generation failed"
            exit 1
          fi

          if [ "${{ needs.terraform-validate.result }}" != "success" ]; then
            echo "❌ Terraform validation failed"
            exit 1
          fi

          if [ "${{ needs.validate-examples.result }}" != "success" ]; then
            echo "❌ LLM semantic validation failed"
            exit 1
          fi

          echo "✅ All validations passed!"
